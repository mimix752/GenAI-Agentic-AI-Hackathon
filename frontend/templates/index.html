<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur Intelligent de CVs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #8697e4 0%, #af85d8 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgb(255, 255, 255);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #bb62cd;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #afa0dc;
            margin-bottom: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #4283e6;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-zone {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-zone:hover {
            background: #f0f0ff;
            border-color: #764ba2;
        }

        .upload-zone.dragover {
            background: #e0e0ff;
            transform: scale(1.02);
        }

        input[type="file"] {
            display: none;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-list {
            margin-top: 20px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            margin-bottom: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            margin: 30px auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 40px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-container {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .candidate-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }

        .candidate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .candidate-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .score-badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .score-high { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .score-medium { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .score-low { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }

        .candidate-details {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .candidate-details.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .skill-tag {
            display: inline-block;
            background: #e0e0ff;
            color: #667eea;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9rem;
        }

        .strength {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .weakness {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .export-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn-export {
            padding: 12px 30px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-export:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #f5c6cb;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analyseur Intelligent de CVs</h1>
        <p class="subtitle">Analyse automatique des CVs par Intelligence Artificielle</p>

        <form id="analyzeForm" enctype="multipart/form-data">
            <!-- Section 1: Upload CVs -->
            <div class="section">
                <h2 class="section-title"> Upload des CVs</h2>
                <div class="upload-zone" id="uploadZone">
                    <p style="font-size: 3rem;">📁</p>
                    <p style="font-size: 1.2rem; margin: 10px 0;">Cliquez ou glissez-déposez vos CVs ici</p>
                    <p style="color: #666;">Formats acceptés: PDF, TXT</p>
                    <input type="file" id="cvFiles" name="cv_files" multiple accept=".pdf,.txt">
                </div>
                <div id="fileList" class="file-list" style="display: none;"></div>
            </div>

            <!-- Section 2: Description du poste -->
            <div class="section">
                <h2 class="section-title"> Description du Poste</h2>
                <textarea 
                    id="jobDescription" 
                    name="job_description" 
                    placeholder="Décrivez le poste recherché en détail...&#10;&#10;Exemple:&#10;Nous recherchons un Développeur Python Senior avec:&#10;- 5+ ans d'expérience en Python&#10;- Expertise en Machine Learning&#10;- Connaissance de LangChain, TensorFlow&#10;- Expérience avec des projets IA en production"
                    required
                ></textarea>
            </div>

            <!-- Section 3: Bouton Analyser -->
            <button type="submit" class="btn" id="analyzeBtn">
                 Analyser les CVs
            </button>
        </form>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="font-size: 1.2rem; color: #667eea;">Analyse en cours... Veuillez patienter</p>
        </div>

        <!-- Résultats -->
        <div class="results" id="results">
            <h2 class="section-title"> Résultats de l'Analyse</h2>
            
            <!-- Statistiques globales -->
            <div class="stats" id="stats"></div>

            <!-- Graphiques -->
            <div class="charts">
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <!-- Liste des candidats -->
            <div id="candidatesList"></div>

            <!-- Boutons d'export -->
            <div class="export-buttons">
                <button class="btn-export" onclick="exportJSON()">📥 Télécharger JSON</button>
                <button class="btn-export" onclick="exportCSV()">📥 Télécharger CSV</button>
            </div>
        </div>
    </div>

    <script>
        let analysisResults = null;

        // Gestion du drag & drop
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('cvFiles');

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            displayFileList();
        });

        fileInput.addEventListener('change', displayFileList);

        function displayFileList() {
            const fileList = document.getElementById('fileList');
            const files = fileInput.files;

            if (files.length === 0) {
                fileList.style.display = 'none';
                return;
            }

            fileList.style.display = 'block';
            fileList.innerHTML = '<strong>Fichiers sélectionnés:</strong>';

            Array.from(files).forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span>📄 ${file.name}</span>
                    <span style="color: #666;">${(file.size / 1024).toFixed(1)} KB</span>
                `;
                fileList.appendChild(fileItem);
            });
        }

        // Soumission du formulaire
        document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const files = fileInput.files;
            const jobDescription = document.getElementById('jobDescription').value;

            // Validation
            if (files.length === 0) {
                alert('⚠️ Veuillez sélectionner au moins un CV');
                return;
            }

            if (jobDescription.length < 20) {
                alert('⚠️ La description du poste doit contenir au moins 20 caractères');
                return;
            }

            // Afficher le loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'error') {
                    throw new Error(data.message || 'Erreur lors de l\'analyse');
                }

                analysisResults = data;
                displayResults(data);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').innerHTML = `
                    <div class="error">
                        <strong>❌ Erreur:</strong> ${error.message}
                    </div>
                `;
                document.getElementById('results').style.display = 'block';
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
            }
        });

        function displayResults(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            // Statistiques
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${data.successful_analyses}/${data.total_candidates}</div>
                    <div class="stat-label">CVs Analysés</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.average_score.toFixed(1)}/100</div>
                    <div class="stat-label">Score Moyen</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.candidates[0]?.name || 'N/A'}</div>
                    <div class="stat-label">Meilleur Candidat (${data.candidates[0]?.score || 0}/100)</div>
                </div>
            `;

            // Graphiques
            displayCharts(data.candidates);

            // Liste des candidats
            displayCandidates(data.candidates);
        }

        function displayCharts(candidates) {
            const successfulCandidates = candidates.filter(c => c.status === 'success');

            // Graphique des scores
            const scoreCtx = document.getElementById('scoreChart').getContext('2d');
            new Chart(scoreCtx, {
                type: 'bar',
                data: {
                    labels: successfulCandidates.map(c => c.name),
                    datasets: [{
                        label: 'Score de Compatibilité',
                        data: successfulCandidates.map(c => c.score),
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });

            // Graphique radar (premier candidat)
            if (successfulCandidates.length > 0) {
                const firstCandidate = successfulCandidates[0];
                const radarCtx = document.getElementById('radarChart').getContext('2d');
                new Chart(radarCtx, {
                    type: 'radar',
                    data: {
                        labels: firstCandidate.skills.slice(0, 5),
                        datasets: [{
                            label: firstCandidate.name,
                            data: firstCandidate.skills.slice(0, 5).map(() => 80 + Math.random() * 20),
                            backgroundColor: 'rgba(102, 126, 234, 0.2)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            r: { beginAtZero: true, max: 100 }
                        }
                    }
                });
            }
        }

        function displayCandidates(candidates) {
            const candidatesList = document.getElementById('candidatesList');
            candidatesList.innerHTML = '<h3 style="margin: 30px 0 20px 0;"> Détails des Candidats</h3>';

            candidates.forEach((candidate, idx) => {
                const scoreClass = candidate.score >= 75 ? 'score-high' : 
                                 candidate.score >= 50 ? 'score-medium' : 'score-low';
                
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '📄';

                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.innerHTML = `
                    <div class="candidate-header" onclick="toggleDetails(${idx})">
                        <div class="candidate-name">${medal} ${candidate.name}</div>
                        <div class="score-badge ${scoreClass}">${candidate.score}/100</div>
                    </div>
                    <div class="candidate-details" id="details-${idx}">
                        <div>
                            <div class="detail-section">
                                <div class="detail-title"> Compétences</div>
                                ${candidate.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
                            </div>
                            <div class="detail-section">
                                <div class="detail-title"> Formation</div>
                                ${candidate.education.map(e => `<div>• ${e}</div>`).join('')}
                            </div>
                            <div class="detail-section">
                                <div class="detail-title"> Points Forts</div>
                                ${candidate.strengths.map(s => `<div class="strength">✅ ${s}</div>`).join('')}
                            </div>
                        </div>
                        <div>
                            <div class="detail-section">
                                <div class="detail-title">⚠️ Points d'Amélioration</div>
                                ${candidate.weaknesses.map(w => `<div class="weakness">⚠️ ${w}</div>`).join('')}
                            </div>
                            <div class="detail-section">
                                <div class="detail-title"> Feedback</div>
                                <p>${candidate.feedback}</p>
                            </div>
                            <div class="detail-section">
                                <div class="detail-title"> Questions d'Entretien</div>
                                ${candidate.interview_questions.map((q, i) => `<div style="margin: 10px 0;">${i+1}. ${q}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                candidatesList.appendChild(card);
            });
        }

        function toggleDetails(idx) {
            const details = document.getElementById(`details-${idx}`);
            details.classList.toggle('active');
        }

        async function exportJSON() {
            const response = await fetch('/api/export/json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(analysisResults)
            });
            const blob = await response.blob();
            downloadBlob(blob, 'resultats_analyse_cvs.json');
        }

        async function exportCSV() {
            const response = await fetch('/api/export/csv', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(analysisResults)
            });
            const blob = await response.blob();
            downloadBlob(blob, 'resultats_analyse_cvs.csv');
        }

        function downloadBlob(blob, filename) {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
